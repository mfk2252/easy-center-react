<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a56db"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <meta name="apple-mobile-web-app-title" content="المركز"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="description" content="نظام إدارة مركز التأهيل والتربية الخاصة المتكامل لإدارة الطلاب، الحضور، الخطط، الموظفين، والتقارير."/>
    <!-- استدعاء خط دبي (Dubai Font) والخطوط العربية المعتمدة -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dubai-font@1.0.1/dubai-font/css/dubai-font.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Tajawal:wght@300;400;500;600;700;800;900&family=Almarai:wght@300;400;700;800&family=Alexandria:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link id="app-manifest" rel="manifest" href="/manifest.webmanifest"/>
    <link id="app-apple-icon" rel="apple-touch-icon" href="/apple-touch-icon.png"/>
    <link id="app-favicon" rel="icon" type="image/png" href="/pwa-192x192.png"/>
    <title>Easy Center - نظام إدارة مركز التأهيل والتربية الخاصة</title>
    <script>
      // تسجيل Service Worker بدون إعادة تحميل تلقائية (كانت تمسح ما يكتبه المستخدم).
      // عند ظهور نسخة جديدة نُبلغ التطبيق ليعرض شريط "تحديث متاح"،
      // ولا يُعاد تحميل الصفحة إلا حين يضغط المستخدم بنفسه.
      if ('serviceWorker' in navigator) {
        window.__scsApplyingUpdate = false;
        window.__scsSwWaiting = null;

        const announceUpdate = (worker) => {
          window.__scsSwWaiting = worker;
          window.dispatchEvent(new CustomEvent('scs_sw_update'));
        };

        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('/sw.js');

            // نسخة جديدة كانت بانتظار التفعيل من زيارة سابقة
            if (reg.waiting && navigator.serviceWorker.controller) announceUpdate(reg.waiting);

            reg.addEventListener('updatefound', () => {
              const nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', () => {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) announceUpdate(nw);
              });
            });

            // فحص التحديثات عند الفتح، ثم كل 30 دقيقة للجلسات الطويلة
            reg.update().catch(() => {});
            setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
          } catch (e) {
            console.warn('SW registration failed:', e);
          }
        });

        // نُعيد التحميل فقط عندما طلب المستخدم التحديث صراحةً
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing || !window.__scsApplyingUpdate) return;
          refreshing = true;
          window.location.reload();
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
