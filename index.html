<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a56db"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <meta name="apple-mobile-web-app-title" content="المركز"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="description" content="نظام إدارة المركز المتكامل"/>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
    <link id="app-favicon" rel="icon" type="image/png" href="/pwa-192x192.png"/>
    <title>نظام إدارة المركز</title>
    <script>
      // تسجيل Service Worker مع تحديث تلقائي فوري
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('/sw.js');
            
            // تحديث فوري عند وجود نسخة جديدة
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                  window.location.reload();
                }
              });
            });

            // تحقق من التحديثات عند كل تحميل
            reg.update();
          } catch(e) {
            console.warn('SW registration failed:', e);
          }
        });

        // إعادة التحميل عند تغيير الـ SW
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
